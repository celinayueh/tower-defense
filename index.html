<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense</title>

    <script src="script.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300&display=swap" rel="stylesheet">
</head>
<body>
    <div id="timerContainer" class="matchTimer">
        <div>
            <h1>STEM Labs Tower Defense</h1>
            <p id="timerText">120 seconds</p>
        </div>
        <div class="buttonContainer">
            <button id="startBtn" class="timerBtn greenBtn" type="button">Start</button>
            <button id="stopBtn" class="timerBtn redBtn" type="button">Stop</button>
            <button id="resetBtn" class="timerBtn blueBtn" type="button">Reset</button>
        </div>
        <div class="columnContainer">
            <button id="countdownSwitch" class="wideBtn whiteBtn" type="button">Enable Switch Sounds</button>
            <button id="scoreSwitch" class="wideBtn whiteBtn" type="button">Score Calculator</button>
        </div>
    </div>
<div id="scoreContainer" class="scoreTracker">
    <h1>Tower Defense Score Calculator</h1>
    <div class="inputContainer">
    <h2 class="title red">Red Team</h2>
    <div class="inputSection">
        <label for="shifted-towers-t1">Shifted Towers</label>
        <input type="number" id="shifted-towers-t1" class="piece-count inputValue" placeholder="" min="0" max="9">
    </div>
    <h3>Knocked Towers</h3>
        <div class="inputSection">
            <label for="purple-t1">Purple Towers</label>
            <input type="number" id="purple-t1" class="piece-count inputValue" placeholder="" min="0" max="3">
        </div>
        <div class="inputSection">
            <label for="orange-t1">Orange Towers</label>
            <input type="number" id="orange-t1" class="piece-count inputValue" placeholder="" min="0" max="3">
        </div>
        <div class="inputSection">
            <label for="teal-t1">Teal Towers</label>
            <input type="number" id="teal-t1" class="piece-count inputValue" placeholder="" min="0" max="3">
        </div>
        <h3>Towers Left Standing</h3>
        <div class="inputSection">
            <label for="full-tower-t1">Full Tower</label>
            <input type="number" id="full-tower-t1" class="piece-count inputValue" placeholder="" min="0" max="3">
        </div>
        <div class="inputSection">
            <label for="partial-tower-t1">Partial Tower</label>
            <input type="number" id="partial-tower-t1" class="piece-count inputValue" placeholder="" min="0" max="3">
        </div>
        <div class="inputSection">
            <label for="single-tower-t1">Single Tower</label>
            <input type="number" id="single-tower-t1" class="piece-count inputValue" placeholder="" min="0" max="3">
        </div>
    <h1 id="score-t1">Score: 0</h1>
    <h2 class="title blue">Blue Team</h2>
    <div class="inputSection">
        <label for="shifted-towers-t2">Shifted Towers</label>
        <input type="number" id="shifted-towers-t2" class="piece-count inputValue" placeholder="" min="0" max="9">
    </div>
    <h3>Knocked Towers</h3>
    <div class="inputSection">
        <label for="purple-t2">Purple Towers</label>
        <input type="number" id="purple-t2" class="piece-count inputValue" placeholder="" min="0" max="3">
    </div>
    <div class="inputSection">
        <label for="orange-t2">Orange Towers</label>
        <input type="number" id="orange-t2" class="piece-count inputValue" placeholder="" min="0" max="3">
    </div>
    <div class="inputSection">
        <label for="teal-t2">Teal Towers</label>
        <input type="number" id="teal-t2" class="piece-count inputValue" placeholder="" min="0" max="3">
    </div>
    <h3>Towers Left Standing</h3>
    <div class="inputSection">
        <label for="full-tower-t2">Full Tower</label>
        <input type="number" id="full-tower-t2" class="piece-count inputValue" placeholder="" min="0" max="3">
    </div>
    <div class="inputSection">
        <label for="partial-tower-t2">Partial Tower</label>
        <input type="number" id="partial-tower-t2" class="piece-count inputValue" placeholder="" min="0" max="3">
    </div>
    <div class="inputSection">
        <label for="single-tower-t2">Single Tower</label>
        <input type="number" id="single-tower-t2" class="piece-count inputValue" placeholder="" min="0" max="3">
    </div>
<h1 id="score-t2">Score: 0</h1>
    <div class="columnContainer">
        <button id="clearBtn" class="wideBtn redBtn" type="button">Clear Fields</button>
        <button id="timerSwitch" class="wideBtn whiteBtn" type="button">Match Timer</button>
    </div>
</div>
    <div id="logo">
        <img src="Images/STEM%20Space%204%20Kids%201%20JPG.jpg" class="logo">

    </div>
</body>
</html>
